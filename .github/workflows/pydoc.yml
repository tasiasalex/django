name: Pydoc Auto-Generator # Nom del procés que sortirà a la pestanya Actions
on: [push] # S'executa automàticament cada vegada que fem un 'git push'

permissions:
  contents: write # Donem permís a GitHub per crear i guardar els fitxers HTML al repo

jobs:
  build:
    runs-on: ubuntu-latest # Utilitzem un servidor virtual de Linux (Ubuntu)
    steps:
      - name: Checkout codi
        uses: actions/checkout@v3 # Pas 1: Copiem el nostre codi de Django al servidor virtual

      - name: Configurar Python
        uses: actions/setup-python@v3 # Pas 2: Instal·lem Python al servidor
        with:
          python-version: '3.12'

      - name: Instal·lar Django
        run: pip install django # Pas 3: Instal·lem Django perquè Pydoc pugui llegir els models sense errors

      - name: Generar Pydoc
        run: |
          mkdir -p docs # Creem una carpeta anomenada 'docs' per guardar la web
          export PYTHONPATH=$PYTHONPATH:. # Diem a Python que busqui el codi a la carpeta actual
          export DJANGO_SETTINGS_MODULE=my_site.settings # Configurem el path dels settings del projecte
          
          # Generem la documentació en HTML dels fitxers models.py i views.py de la nostra app 'blog'
          python -m pydoc -w blog.models blog.views
          
          mv *.html docs/ # Movem els fitxers HTML generats a la carpeta docs per publicar-los

      - name: Deploy a GitHub Pages
        uses: peaceiris/actions-gh-pages@v3 # Pas 4: Publiquem el contingut de 'docs' a GitHub Pages
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir:
